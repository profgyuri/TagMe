name: Bug report
description: Report something that isn't working
title: "[Bug]: "
labels: ["bug", "triage"]
assignees:
  - "profgyuri"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell me what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: checkboxes
    id: os
    attributes:
      label: Operating system
      options:
        - label: Linux
        - label: Windows
      validations:
        required: true
