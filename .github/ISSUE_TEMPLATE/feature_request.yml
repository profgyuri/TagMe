name: Feature request
description: Suggest an idea
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How would you prefer the solution to be implemented? What would you expect to happen?
